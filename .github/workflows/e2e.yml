name: Full E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # This workflow requires the dedicated FitPath Clerk, Neon, R2, and seeded
    # test environment. Never configure these secrets with production values.
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.TEST_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.TEST_CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.TEST_CLERK_PUBLISHABLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.TEST_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.TEST_R2_BUCKET_NAME }}
      R2_ENDPOINT: ${{ secrets.TEST_R2_ENDPOINT }}
      CYPRESS_userEmail: ${{ secrets.CYPRESS_USER_EMAIL }}
      CYPRESS_userPassword: ${{ secrets.CYPRESS_USER_PASSWORD }}
      CYPRESS_incompleteUserEmail: ${{ secrets.CYPRESS_INCOMPLETE_USER_EMAIL }}
      CYPRESS_incompleteUserPassword: ${{ secrets.CYPRESS_INCOMPLETE_USER_PASSWORD }}
      CYPRESS_trainerEmail: ${{ secrets.CYPRESS_TRAINER_EMAIL }}
      CYPRESS_trainerPassword: ${{ secrets.CYPRESS_TRAINER_PASSWORD }}
      CYPRESS_adminEmail: ${{ secrets.CYPRESS_ADMIN_EMAIL }}
      CYPRESS_adminPassword: ${{ secrets.CYPRESS_ADMIN_PASSWORD }}
      CYPRESS_assignedClientClerkUserId: ${{ secrets.CYPRESS_ASSIGNED_CLIENT_CLERK_USER_ID }}
      CYPRESS_pendingTrainerApplicationId: ${{ secrets.CYPRESS_PENDING_TRAINER_APPLICATION_ID }}
      CYPRESS_unrelatedPlanId: ${{ secrets.CYPRESS_UNRELATED_PLAN_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start FitPath services
        run: |
          npm run dev > fitpath-services.log 2>&1 &
          if ! curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:3000/health; then
            echo "FitPath API did not start. Startup log follows:"
            sed -n '1,200p' fitpath-services.log
            exit 1
          fi
          if ! curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:5173; then
            echo "FitPath client did not start. Startup log follows:"
            sed -n '1,200p' fitpath-services.log
            exit 1
          fi

      - name: Run Cypress E2E tests
        run: npm run e2e:run -- --spec cypress/e2e/critical-workflows.cy.ts

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-artifacts
          if-no-files-found: ignore
          path: |
            cypress/screenshots
            cypress/videos
            fitpath-services.log
